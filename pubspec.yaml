name: flutter_python_bridge
description: Embedded CPython runtime for Flutter on Android and iOS.
version: 0.3.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.cpythonruntime.cpython_runtime
        pluginClass: CPythonRuntimePlugin
      ios:
        pluginClass: CPythonRuntimePlugin
